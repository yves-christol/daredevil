<!doctype html>
<html lang="en">
<head><title>Log in</title></head>
<body>
<main>
<h1>Log in</h1>
<form id="f">
  <label for="email">Email</label><input id="email" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button type="submit">Log in</button>
</form>
</main>
<script>
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  document.cookie = 'dd_session=ok; path=/';
  location.href = new URLSearchParams(location.search).get('next') || '/account';
});
</script>
</body>
</html>
